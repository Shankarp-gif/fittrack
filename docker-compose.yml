services:
  database:
    image: postgres:16
    container_name: fittrack-db
    environment:
      POSTGRES_DB: fitness
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - fittrack_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./apps/backend
    container_name: fittrack-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://database:5432/fitness
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXP_MIN: 30
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS}
    depends_on:
      - database
    ports:
      - "1111:1111"

  frontend:
    build:
      context: ./apps/frontend
    container_name: fittrack-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  fittrack_data:
