spring:
  application:
    name: fittrack-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    repair-on-migrate: true
    validate-on-migrate: false

server:
  port: 1111

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:}
    access-expiration-minutes: ${JWT_ACCESS_EXP_MIN:30}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  security:
    hide-user-not-found-exceptions: ${HIDE_USER_NOT_FOUND_EXCEPTIONS:true}

logging:
  level:
    root: INFO
    com.fittrack.backend: INFO
    org.springframework.security: INFO
  file:
    path: logs
    max-size: 10MB
    max-history: 30
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

